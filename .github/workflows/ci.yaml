name: Build and Push Docker Images

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  FRONTEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.FRONTEND_REPO }}
  BACKEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.BACKEND_REPO }}

jobs:

  # --------------------------------------------------
  # Detect changes
  # --------------------------------------------------

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed files
        id: changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^client/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          if git diff --name-only HEAD^ HEAD | grep -q '^server/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi


  # --------------------------------------------------
  # Build and push frontend
  # --------------------------------------------------

  frontend:
    name: Build and Push Frontend
    needs: changes

    if: needs.changes.outputs.frontend == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest


  # --------------------------------------------------
  # Build and push backend
  # --------------------------------------------------

  backend:
    name: Build and Push Backend
    needs: changes

    if: needs.changes.outputs.backend == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest


  # --------------------------------------------------
  # Update frontend Kubernetes manifest
  # --------------------------------------------------

  update-frontend-manifest:
    name: Update Frontend Image Tag

    needs:
      - changes
      - frontend

    if: |
      needs.changes.outputs.frontend == 'true' &&
      needs.frontend.result == 'success'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update frontend image
        run: |
          chmod +x scripts/script.sh

          ./scripts/script.sh \
            frontend \
            "${{ github.sha }}"
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

      - name: Commit frontend manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s-manifests/frontend-deployment.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update frontend image to ${{ github.sha }} [skip ci]"

          git push


  # --------------------------------------------------
  # Update backend Kubernetes manifest
  # --------------------------------------------------

  update-backend-manifest:
    name: Update Backend Image Tag

    needs:
      - changes
      - backend

    if: |
      needs.changes.outputs.backend == 'true' &&
      needs.backend.result == 'success'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update backend image
        run: |
          chmod +x scripts/script.sh

          ./scripts/script.sh \
            backend \
            "${{ github.sha }}"
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

      - name: Commit backend manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s-manifests/backend-deployment.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update backend image to ${{ github.sha }} [skip ci]"

          git push
